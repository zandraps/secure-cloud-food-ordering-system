<!DOCTYPE html>
<html>

<head>

    <title>Register</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav>

    <h2>🍔 FoodExpress</h2>

</nav>

<h1>Create Your Account</h1>

<form action="/register" method="POST">

    <input
        type="text"
        name="name"
        placeholder="Enter your name"
        required
    >

    <br><br>

    <input
        type="email"
        name="email"
        placeholder="Enter your email"
        required
    >

    <br><br>

    <input
        type="password"
        name="password"
        placeholder="Enter your password"
        required
    >

    <br><br>

    <button type="submit">
        Register
    </button>

</form>

<br>

<p>
    Already have an account?
</p>

<a href="/login">

    <button>
        Login
    </button>

</a>

</body>

</html>
