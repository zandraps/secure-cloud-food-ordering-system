<!DOCTYPE html>
<html>

<head>

    <title>Order Details</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav>

    <h2>🍔 FoodExpress</h2>

</nav>

<h1>📋 Order Details</h1>

<div class="food-container">

{% if items %}

    {% for item in items %}

    <div class="food-card">

        <h2>{{ item.name }}</h2>

        <p>
            Price : ₹{{ item.price }}
        </p>

        <p>
            Quantity : {{ item.quantity }}
        </p>

        <p>
            Total : ₹{{ item.price * item.quantity }}
        </p>

    </div>

    {% endfor %}

{% else %}

<h2>No Items Found!</h2>

{% endif %}

</div>

<br>

<a href="/orders">

    <button>Back to Orders</button>

</a>

</body>

</html>
