name: FoodExpress CI/CD

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build FoodExpress Docker image
        run: docker build -t foodexpress-app ./backend

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::972778199547:role/FoodExpress-GitHub-Actions-Role
          aws-region: ap-south-1

      - name: Deploy FoodExpress through SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-011332cce9d0a759b" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["sudo -u ubuntu /home/ubuntu/deploy_foodexpress.sh"]' \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-011332cce9d0a759b"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-011332cce9d0a759b"
